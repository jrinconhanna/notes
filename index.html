<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Bookmarkable Page</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.65; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #222; }
    input { width: 100%; padding: 10px 12px; font-size: 18px; font-weight: bold; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; }
    #richInput { width: 100%; min-height: 280px; max-height: 500px; overflow-y: auto; padding: 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; background: #fff; outline: none; }
    #richInput:focus { border-color: #111; }
    #richInput:empty:before { content: attr(data-placeholder); color: #999; pointer-events: none; }
    button { background: #111; color: #fff; border: none; padding: 10px 18px; font-size: 15px; border-radius: 6px; cursor: pointer; margin-top: 12px; margin-right: 8px; }
    button.secondary { background: #eee; color: #222; }
    #viewer { display: none; }
    #content { margin-top: 20px; }
    #content h1, #richInput h1 { font-size: 26px; margin: 24px 0 12px; font-weight: 700; }
    #content h2, #richInput h2 { font-size: 21px; margin: 24px 0 8px; font-weight: 700; color: #111; }
    #content h3, #richInput h3 { font-size: 18px; margin: 20px 0 6px; font-weight: 700; color: #111; }
    #content p, #richInput p { margin: 0 0 12px; }
    #content ul, #content ol, #richInput ul, #richInput ol { padding-left: 22px; margin: 0 0 14px; }
    #content li, #richInput li { margin-bottom: 6px; }
    #content a, #richInput a { color: #0969da; text-decoration: none; font-weight: 500; border-bottom: 1px solid #b6d4fe; }
    #content a:hover { border-bottom-color: #0969da; }
    .hint { font-size: 13px; color: #666; margin-top: 8px; }
    .bar { margin-top: 36px; padding-top: 16px; border-top: 1px solid #eee; font-size: 14px; color: #666; }
  </style>
</head>
<body>

  <!-- EDITOR MODE -->
  <div id="editor">
    <h2>Create a Bookmarkable Page</h2>
    <input id="titleInput" placeholder="Page Title (e.g., Theory of Impetus)" />
    <div id="richInput" contenteditable="true" data-placeholder="Copy and paste directly from any webpage or chat (headings, bold, bullets, and links stay intact)..."></div>
    <div class="hint">
      Highlight text on any webpage, press <strong>Cmd+C</strong>, and paste here with <strong>Cmd+V</strong>.
    </div>
    <button onclick="publishPage()">Create Live Page</button>
    <button class="secondary" onclick="clearEditor()">Clear</button>
  </div>

  <!-- VIEWER MODE -->
  <div id="viewer">
    <h1 id="pageTitle"></h1>
    <div id="content"></div>
    <div class="bar">
      Press <strong>Cmd+D</strong> (or <strong>Ctrl+D</strong>) to bookmark or pin this page.
      <br><button class="secondary" onclick="editPage()">Edit / Create New</button>
    </div>
  </div>

  <script>
    function sanitizeKeepStructure(container) {
      container.querySelectorAll('script, style, iframe, svg, button, input').forEach(el => el.remove());
      container.querySelectorAll('*').forEach(el => {
        const href = el.tagName === 'A' ? el.getAttribute('href') : null;
        for (const attr of [...el.attributes]) el.removeAttribute(attr.name);
        if (href) {
          el.setAttribute('href', href);
          el.setAttribute('target', '_blank');
          el.setAttribute('rel', 'noopener');
        }
      });
      return container.innerHTML;
    }

    async function compress(str) {
      const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
      const buf = await new Response(stream).arrayBuffer();
      return btoa(String.fromCharCode(...new Uint8Array(buf)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function decompress(b64) {
      const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return await new Response(stream).text();
    }

    async function publishPage() {
      const title = document.getElementById('titleInput').value.trim() || 'Saved Note';
      const clone = document.getElementById('richInput').cloneNode(true);
      const cleanHTML = sanitizeKeepStructure(clone);
      const payload = JSON.stringify({ t: title, h: cleanHTML });
      const hash = await compress(payload);
      window.location.hash = hash;
      loadFromHash();
    }

    async function loadFromHash() {
      const hash = window.location.hash.slice(1);
      if (!hash) {
        document.getElementById('editor').style.display = 'block';
        document.getElementById('viewer').style.display = 'none';
        return;
      }
      try {
        const data = JSON.parse(await decompress(hash));
        document.title = data.t;
        document.getElementById('pageTitle').textContent = data.t;
        document.getElementById('content').innerHTML = data.h || data.c || '';
        document.getElementById('editor').style.display = 'none';
        document.getElementById('viewer').style.display = 'block';
      } catch (e) {
        alert('Invalid or corrupted page link.');
      }
    }

    function editPage() {
      document.getElementById('titleInput').value = document.getElementById('pageTitle').textContent;
      document.getElementById('richInput').innerHTML = document.getElementById('content').innerHTML;
      window.location.hash = '';
      loadFromHash();
    }

    function clearEditor() {
      document.getElementById('titleInput').value = '';
      document.getElementById('richInput').innerHTML = '';
    }

    window.addEventListener('hashchange', loadFromHash);
    loadFromHash();
  </script>
</body>
</html>
